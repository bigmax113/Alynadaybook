<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Q&A по вашим документам</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <style>
    .spinner{border:4px solid #f3f3f3;border-top:4px solid #3b82f6;border-radius:50%;width:16px;height:16px;animation:spin 1s linear infinite;display:inline-block;margin-right:6px}
    @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div id="root" class="max-w-5xl mx-auto mt-6"></div>

  <script type="text/babel">
    const ls = window.localStorage;

    function App(){
      const [sessionId, setSessionId] = React.useState(ls.getItem("session_id") || "");
      const [files, setFiles] = React.useState([]);
      const [status, setStatus] = React.useState("Готово");
      const [question, setQuestion] = React.useState("");
      const [answer, setAnswer] = React.useState("");
      const [busy, setBusy] = React.useState(false);

      React.useEffect(() => {
        initSession();
      }, []);

      const initSession = async () => {
        try{
          const stored = ls.getItem("session_id");
          const resp = await axios.post("/api/session", { session_id: stored || "" });
          const sid = resp.data.session_id;
          ls.setItem("session_id", sid);
          setSessionId(sid);
          setStatus("Сессия готова");
        }catch(e){
          setStatus("Ошибка инициализации: " + (e.response?.data?.error || e.message));
        }
      };

      const onUpload = async (ev) => {
        ev.preventDefault();
        const input = document.getElementById("file-input");
        if (!input.files || !input.files.length) {
          setStatus("Выберите файлы для загрузки");
          return;
        }
        setBusy(true);
        const form = new FormData();
        form.append("session_id", sessionId);
        for (const f of input.files) form.append("files", f);

        try{
          const resp = await axios.post("/api/upload_files", form, {
            headers: {"Content-Type": "multipart/form-data"},
          });
          setFiles(resp.data.files || []);
          setStatus(resp.data.message + ` | Кэш: ${resp.data.cache_size} символов`);
        }catch(e){
          setStatus("Ошибка загрузки: " + (e.response?.data?.error || e.message));
        }finally{
          setBusy(false);
          input.value = "";
        }
      };

      const ask = async () => {
        if(!question.trim()){
          setAnswer("Пожалуйста, введите вопрос.");
          return;
        }
        setBusy(true);
        setAnswer("");
        try{
          const resp = await axios.post("/api/submit_question", { session_id: sessionId, question });
          setAnswer(resp.data.answer);
          setStatus("Вопрос обработан");
        }catch(e){
          setAnswer("Ошибка: " + (e.response?.data?.error || e.message));
          setStatus("Ошибка обработки");
        }finally{
          setBusy(false);
        }
      };

      const exportXlsx = async () => {
        try{
          const url = `/api/export_xlsx?session_id=${encodeURIComponent(sessionId)}`;
          const resp = await axios.get(url, { responseType: "blob" });
          const blob = new Blob([resp.data], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `answer_${sessionId}.xlsx`;
          a.click();
          URL.revokeObjectURL(a.href);
        }catch(e){
          setStatus("Ошибка выгрузки XLSX: " + (e.response?.data?.error || e.message));
        }
      };

      const clearSession = async () => {
        setBusy(true);
        try{
          await axios.post("/api/clear", { session_id: sessionId });
          ls.removeItem("session_id");
          setFiles([]);
          setAnswer("");
          setQuestion("");
          setStatus("Сессия очищена");
          await initSession();
        }catch(e){
          setStatus("Ошибка очистки: " + (e.response?.data?.error || e.message));
        }finally{
          setBusy(false);
        }
      };

      return (
        <div className="bg-white rounded-xl shadow p-6">
          <h1 className="text-2xl font-semibold mb-4">Q&A по вашим документам (PDF / DOCX / XLSX)</h1>

          <div className="text-sm text-gray-700 mb-3">
            <b>Сессия:</b> <span className="font-mono">{sessionId}</span>
          </div>

          <form onSubmit={onUpload} className="flex items-center gap-3 mb-4">
            <input id="file-input" type="file" multiple accept=".pdf,.docx,.xlsx,.zip"
                   className="block w-full text-sm text-gray-700" />
            <button type="submit"
                    className="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 disabled:bg-blue-300"
                    disabled={busy}>
              Загрузить
            </button>
            <button type="button"
                    onClick={clearSession}
                    className="bg-gray-200 text-gray-800 px-3 py-2 rounded-md hover:bg-gray-300 disabled:bg-gray-200"
                    disabled={busy}>
              Очистить
            </button>
          </form>

          <div className="mb-4">
            <div className="text-sm text-gray-600 mb-1"><b>Статус:</b> {busy && <span className="spinner"></span>} {status}</div>
            <div className="text-sm text-gray-700">
              <b>Загруженные файлы:</b>
              <ul className="list-disc ml-6">
                {files.map((f,i) => <li key={i}>{f.name} <span className="text-gray-500">({f.size} байт)</span></li>)}
                {files.length===0 && <li className="text-gray-400">пока нет</li>}
              </ul>
            </div>
          </div>

          <div className="flex gap-2 mb-3">
            <input
              className="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Введите вопрос, например: «Найдите все задачи, где участвовал Иванов; посчитайте суммарное время»"
              value={question}
              onChange={e=>setQuestion(e.target.value)}
              onKeyDown={e=>e.key==='Enter' && ask()}
            />
            <button onClick={ask}
                    className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 disabled:bg-blue-300"
                    disabled={busy}>
              {busy ? "Обработка..." : "➤"}
            </button>
            <button onClick={exportXlsx}
                    className="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 disabled:bg-emerald-300"
                    disabled={!answer || busy}>
              Выгрузить в XLSX
            </button>
          </div>

          <div className="bg-gray-50 border rounded-lg p-4 h-72 overflow-y-auto text-gray-800">
            <pre className="whitespace-pre-wrap">{answer}</pre>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App/>, document.getElementById('root'));
  </script>
</body>
</html>
